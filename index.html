<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ocufuse Web App</title>
<meta name="description" content="The Ocufuse web app is opening soon. Join early access.">
<link rel="canonical" href="https://ocufuse.com/">
<meta property="og:title" content="Ocufuse Web App">
<meta property="og:description" content="The Ocufuse web app is opening soon. Join early access.">
<meta property="og:url" content="https://ocufuse.com/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#FFF9EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161C" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>/* Ocufuse shared styles. Design lock: cream base, electric blue actions, mint health accent, yellow for rewards and notes. 4px grid. */
:root{
  --bg:#FFF9EE; --surface:#FFFFFF; --ink:#1B1F2A; --muted:#5A6070; --line:#EFE6D4;
  --blue:#1267F5; --blue-ink:#FFFFFF; --blue-soft:#E3EDFF;
  --mint:#2FB47C; --mint-soft:#DDF5E9; --mint-ink:#11643F;
  --yellow:#FFC93C; --yellow-soft:#FFF1C7;
  --red:#C62F2F; --red-soft:#FDE6E4;
  --shadow:0 2px 0 rgba(27,31,42,.06), 0 12px 32px rgba(27,31,42,.06);
  --f-display:"Nunito", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --f-body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-sm:12px; --r-md:20px; --r-lg:28px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14161C; --surface:#1E212A; --ink:#F3F1EC; --muted:#A9AEBB; --line:#2C303B;
  --blue:#4D8DFF; --blue-ink:#0B1020; --blue-soft:#1C2A47;
  --mint:#4FD39A; --mint-soft:#163327; --mint-ink:#8BE9BE;
  --yellow:#FFD45E; --yellow-soft:#3A3220;
  --red:#FF7A70; --red-soft:#3A1E1D;
  --shadow:0 2px 0 rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14161C; --surface:#1E212A; --ink:#F3F1EC; --muted:#A9AEBB; --line:#2C303B;
  --blue:#4D8DFF; --blue-ink:#0B1020; --blue-soft:#1C2A47;
  --mint:#4FD39A; --mint-soft:#163327; --mint-ink:#8BE9BE;
  --yellow:#FFD45E; --yellow-soft:#3A3220;
  --red:#FF7A70; --red-soft:#3A1E1D;
  --shadow:0 2px 0 rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(36px,5.5vw,60px);font-weight:900;letter-spacing:-.02em}
h2{font-size:clamp(26px,3.6vw,38px);font-weight:900;letter-spacing:-.01em}
h3{font-size:20px;font-weight:800}
p{margin:0}
.lead{font-size:19px;color:var(--muted);max-width:36em}
.eyebrow{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mint-ink)}
.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:16px;background:var(--surface);padding:8px 12px;z-index:9}

/* nav */
.nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.nav .wrap{display:flex;align-items:center;gap:24px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:-.01em}
.nav ul{display:flex;gap:24px;list-style:none;margin:0 0 0 auto;padding:0}
.nav ul a{color:var(--muted);text-decoration:none;font-weight:600;font-size:15px}
.nav ul a:hover,.nav ul a[aria-current="page"]{color:var(--ink)}
@media (max-width:760px){.nav ul{display:none}.nav .btn{margin-left:auto}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;font-family:var(--f-display);font-weight:800;font-size:16px;text-decoration:none;border:2px solid transparent;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease}
.btn-primary{background:var(--blue);color:var(--blue-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--blue) 60%,#000)}
.btn-primary:hover{transform:translateY(-1px)}
.btn-primary:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--blue) 60%,#000)}
.btn-primary[disabled]{opacity:.6;cursor:progress;transform:none}
.btn-sm{min-height:40px;padding:0 16px;font-size:15px}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}

/* page header for inner pages */
.page-head{padding-block:56px 32px}
.page-head .wrap{display:grid;gap:16px}
.meta{font-size:15px;color:var(--muted)}

/* long-form documents */
.doc{padding-block:8px 80px}
.doc .wrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:56px;align-items:start}
.toc{position:sticky;top:96px;font-size:15px}
.toc b{display:block;font-family:var(--f-display);font-weight:800;margin-bottom:8px}
.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.toc a{color:var(--muted);text-decoration:none}
.toc a:hover{color:var(--ink)}
.prose{max-width:68ch;min-width:0}
.prose h2{font-size:26px;margin:48px 0 12px;scroll-margin-top:88px}
.prose h2:first-child{margin-top:0}
.prose h3{margin:28px 0 8px}
.prose p,.prose ul,.prose ol,.prose table{margin:0 0 16px}
.prose ul,.prose ol{padding-left:22px}
.prose li{margin-bottom:6px}
.prose table{width:100%;border-collapse:collapse;font-size:15px}
.prose th,.prose td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
.prose th{font-family:var(--f-display);font-weight:800}
.tbl{overflow-x:auto;margin-bottom:16px}
.tbl table{margin:0;min-width:520px}
@media (max-width:860px){.doc .wrap{grid-template-columns:1fr;gap:24px}.toc{position:static;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:16px}}

.callout{border-radius:var(--r-sm);padding:16px 20px;font-size:16px;margin:0 0 16px}
.callout-note{background:var(--yellow-soft)}
.callout-safe{background:var(--mint-soft)}
.callout-urgent{background:var(--red-soft);border-left:4px solid var(--red)}
.callout strong:first-child{display:block;font-family:var(--f-display);font-weight:800;margin-bottom:4px}

/* cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:24px;display:grid;gap:8px;align-content:start;min-width:0}
.card p{color:var(--muted);font-size:16px}
@media (max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.cards{grid-template-columns:1fr}}

/* forms */
.form{display:grid;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:24px}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:15px}
.field small{color:var(--muted);font-size:14px}
.field input,.field select,.field textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;width:100%}
.field textarea{min-height:150px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.hp{position:absolute;left:-5000px}
.status{border-radius:var(--r-sm);padding:12px 16px;font-size:15px}
.status.ok{background:var(--mint-soft);color:var(--ink)}
.status.err{background:var(--red-soft);color:var(--ink)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{margin-top:5px;width:18px;height:18px;accent-color:var(--blue)}

/* faq */
.faq{display:grid;gap:8px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 20px}
.faq summary{cursor:pointer;font-family:var(--f-display);font-weight:800;font-size:17px;padding:14px 0;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--blue);font-size:22px;line-height:1}
.faq details[open] summary::after{content:"\2212"}
.faq details p{padding-bottom:16px;color:var(--muted)}

.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;margin:0}
.dl dt{font-weight:700}
.dl dd{margin:0;color:var(--muted);min-width:0;overflow-wrap:anywhere}

/* footer */
footer{border-top:1px solid var(--line);padding-block:48px 32px;font-size:15px;color:var(--muted)}
.foot{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:32px}
.foot h4{font-family:var(--f-display);font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin:0 0 12px}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.foot a{color:var(--muted);text-decoration:none}
.foot a:hover{color:var(--ink);text-decoration:underline}
.foot p{max-width:30ch}
.foot-base{margin-top:32px;padding-top:20px;border-top:1px solid var(--line);font-size:14px}
@media (max-width:760px){.foot{grid-template-columns:1fr 1fr}.foot>div:first-child{grid-column:1/-1}}
.foot .brand{color:var(--ink)}
</style>
<style>
.shell{min-height:100%;display:grid;place-items:center;padding-block:64px}
.box{max-width:520px;display:grid;gap:20px;text-align:center;justify-items:center}
.box .form{text-align:left;width:100%}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<main id="main" class="shell"><div class="wrap"><div class="box">
<a class="brand" href="https://ocufuse.com" aria-label="Ocufuse home"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10" fill="var(--blue)"/><path d="M5 16c3-5.5 7-8 11-8s8 2.5 11 8c-3 5.5-7 8-11 8s-8-2.5-11-8z" fill="#fff"/><circle cx="16" cy="16" r="4.5" fill="var(--blue)"/><circle cx="17.6" cy="14.4" r="1.4" fill="#fff"/></svg> Ocufuse</a>
<span class="eyebrow">Web app</span>
<h1 style="font-size:clamp(34px,6vw,52px)">Opening soon</h1>
<p class="lead">The Ocufuse web app is in its final stage of testing. Leave your email and we'll send you a link as soon as it opens.</p>
<form class="form" id="w" action="https://formsubmit.co/hello@ocufuse.com" method="POST" novalidate>
<input type="hidden" name="_subject" value="Ocufuse early access request">
<input type="hidden" name="_template" value="table"><input type="hidden" name="_captcha" value="false">
<input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
<div class="field"><label for="w-email">Email address</label><input id="w-email" name="email" type="email" autocomplete="email" required></div>
<label class="check"><input type="checkbox" id="w-ok" required> <span>Email me when the web app opens. See the <a href="https://ocufuse.com/privacy">privacy policy</a>.</span></label>
<button class="btn btn-primary" type="submit" id="w-send">Get early access</button>
<div class="status" id="w-status" role="status" aria-live="polite" hidden></div>
</form>
<p class="meta"><a href="https://ocufuse.com">Back to ocufuse.com</a> · <a href="https://ocufuse.com/support">Support</a></p>
</div></div></main>
<script>
(function(){var f=document.getElementById("w"),s=document.getElementById("w-status"),b=document.getElementById("w-send");
function show(ok,m){s.hidden=false;s.className="status "+(ok?"ok":"err");s.textContent=m;}
f.addEventListener("submit",function(e){e.preventDefault();if(!f.checkValidity()){f.reportValidity();return;}
b.disabled=true;b.textContent="Sending...";
fetch(f.action.replace("formsubmit.co/","formsubmit.co/ajax/"),{method:"POST",headers:{"Accept":"application/json"},body:new FormData(f)})
.then(function(r){return r.json().then(function(j){return r.ok&&String(j.success)==="true"})})
.then(function(ok){if(ok){f.reset();show(true,"You're on the list. We'll email you when the web app opens.");}else show(false,"That didn't go through. Please try again, or email hello@ocufuse.com.");})
.catch(function(){show(false,"The connection failed. Check your internet and try again.");})
.finally(function(){b.disabled=false;b.textContent="Get early access";});});})();
</script></body></html>
